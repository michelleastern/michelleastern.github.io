<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2b6cb0" />
      <stop offset="50%" stop-color="#4fd1c5" />
      <stop offset="100%" stop-color="#90cdf4" />
    </linearGradient>
    <style>
      .bg { fill: url(#g); }
      .overlay { fill: rgba(0,0,0,0.25); }
      .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size:48px; fill:#ffffff; font-weight:700; }
      .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size:20px; fill:#f0f7fb; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="400" rx="6" ry="6" />
  <rect x="0" y="0" width="1600" height="400" fill="rgba(0,0,0,0.18)" />

  <g transform="translate(60,120)">
    <text class="title">Banner Image — Replace me</text>
    <text class="subtitle" y="56">1600×400 placeholder for Michelle Stern personal webpage</text>
  </g>

  <!-- decorative wave at bottom -->
  <path d="M0,300 C200,360 400,240 800,300 C1200,360 1400,240 1600,300 L1600,400 L0,400 Z" fill="rgba(255,255,255,0.06)" />
</svg>
